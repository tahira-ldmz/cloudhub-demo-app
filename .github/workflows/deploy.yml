name: CloudHubPK CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloudhub-app:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudhub-app:latest

      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker stop cloudhub-container || true

            docker rm cloudhub-container || true

            docker pull ${{ secrets.DOCKER_USERNAME }}/cloudhub-app:latest

            docker run -d \
              --name cloudhub-container \
              -p 5000:5000 \
              ${{ secrets.DOCKER_USERNAME }}/cloudhub-app:latest
